<!doctype html>
<html lang="en">
  <body style="background:#fbf7f2;color:#1f2d3d;font-family:Arial,sans-serif;padding:24px;">
    <div style="background:#ffffff;border:1px solid #ece4da;border-radius:16px;max-width:520px;margin:0 auto;padding:32px;">
      <h1 style="font-size:24px;margin:0 0 16px;">Verify your email</h1>
      <p style="font-size:16px;line-height:1.5;">Enter this code in Homeward Paws to finish creating your account:</p>
      <p style="color:#227a71;font-size:32px;font-weight:700;letter-spacing:6px;text-align:center;">{{ .Token }}</p>
      <p style="color:#5e6b78;font-size:14px;line-height:1.5;">If you did not create a Homeward Paws account, you can ignore this email.</p>
    </div>
  </body>
</html>
