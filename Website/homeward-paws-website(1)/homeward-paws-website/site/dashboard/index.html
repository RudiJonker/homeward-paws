<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Project dashboard · Homeward Paws</title>
<meta name="theme-color" content="#FBF7F2">
<link rel="icon" type="image/png" sizes="48x48" href="../assets/img/favicon-48.png">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  [hidden] { display: none !important; }
  body { background: var(--bg); }
  .dash { padding-block: 24px 64px; display: grid; gap: 20px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 14px; }
  .topbar .brand img { height: 40px; width: auto; }
  .topbar-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; font-weight: 700; color: var(--ink-2); }
  .lock { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--ink); color: var(--on-dark); font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
  .lock svg { width: 14px; height: 14px; }
  .refresh { font: 800 14px var(--font); color: var(--primary); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; min-height: 36px; }
  .refresh:hover { background: var(--primary-light); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 22px; min-width: 0; }
  .panel h2 { font-size: 19px; font-weight: 900; display: flex; align-items: center; gap: 10px; }
  .panel h2 svg { width: 22px; height: 22px; color: var(--primary); flex-shrink: 0; }
  .panel .sub { color: var(--ink-2); font-weight: 600; font-size: 14px; margin-top: 4px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }

  /* Hero */
  .hero-panel { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 2fr); gap: 24px; align-items: center; background: linear-gradient(135deg, var(--surface) 0%, var(--primary-light) 140%); }
  .gauge-wrap { display: grid; justify-items: center; text-align: center; gap: 4px; }
  .gauge { width: 100%; max-width: 320px; }
  .gauge-value { font-size: 52px; font-weight: 900; line-height: 1; margin-top: 2px; color: var(--ink); }
  .gauge-value small { font-size: 24px; color: var(--ink-2); }
  .gauge-label { font-size: 15px; font-weight: 800; margin-top: 6px; }
  .gauge-note { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .dials { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .dial { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px 12px; display: grid; justify-items: center; gap: 6px; text-align: center; }
  .ring { position: relative; width: 108px; height: 108px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .ring-text { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: 24px; }
  .ring .ring-text small { display: block; font-size: 12px; color: var(--ink-2); font-weight: 700; margin-top: -4px; }
  .dial strong { font-size: 15px; font-weight: 800; }
  .dial span { font-size: 13px; font-weight: 600; color: var(--ink-2); }

  /* Checkpoint roadmap */
  .roadmap { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
  .cp { position: relative; padding: 14px 12px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--bg); display: grid; gap: 8px; align-content: start; }
  .cp.active { border-color: var(--primary); background: var(--primary-light); box-shadow: 0 0 0 3px rgba(34, 122, 113, 0.12); }
  .cp-num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 14px; background: var(--surface-muted); color: var(--ink-2); }
  .cp.done .cp-num { background: var(--reunited); color: #fff; }
  .cp.active .cp-num { background: var(--primary); color: #fff; }
  .cp b { font-size: 14px; font-weight: 800; line-height: 1.25; }
  .cp p { font-size: 12px; font-weight: 600; color: var(--ink-2); line-height: 1.35; }
  .bar { height: 8px; border-radius: 999px; background: var(--surface-muted); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: inherit; background: var(--primary); width: 0; transition: width 900ms cubic-bezier(.2,.8,.2,1); }
  .cp.done .bar > i { background: var(--reunited); }
  .cp .st { justify-self: start; }

  /* Status chips (colour + icon + label) */
  .st { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
  .st svg { width: 13px; height: 13px; }
  .st.done { background: var(--reunited-tint); color: var(--reunited-on); }
  .st.open { background: var(--missing-tint); color: var(--missing-on); }
  .st.active { background: var(--primary-light); color: var(--primary-dark); }
  .st.next, .st.later { background: var(--surface-muted); color: var(--ink-2); }
  .st.unverified { background: var(--highlight-light); color: var(--highlight-on); }

  /* Lists */
  .checklist { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
  .checklist li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; font-weight: 600; }
  .tick { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; }
  .tick svg { width: 14px; height: 14px; }
  .tick.yes { background: var(--reunited); color: #fff; }
  .tick.no { background: var(--surface-muted); color: var(--ink-2); border: 2px solid var(--line); }
  .gate { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
  .gate li { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px 14px; display: grid; gap: 6px; background: var(--bg); }
  .gate li b { font-size: 15px; font-weight: 800; line-height: 1.35; }
  .gate li span.note { font-size: 13px; font-weight: 600; color: var(--ink-2); }

  /* Stats */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 120px), 1fr)); gap: 12px; margin-top: 16px; }
  .tile { background: var(--bg); border-radius: var(--radius-md); padding: 14px; }
  .tile strong { display: block; font-size: 28px; font-weight: 900; line-height: 1.1; }
  .tile span { font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .chart { margin-top: 18px; }
  .chart svg { width: 100%; height: 150px; display: block; }
  .chart-legend { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--ink-2); margin-top: 6px; }
  .last-commit { margin-top: 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); overflow-wrap: anywhere; }
  .last-commit code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); font-size: 12px; background: var(--surface-muted); padding: 1px 6px; border-radius: 6px; }

  .findings-head { display: flex; gap: 18px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .donut { width: 96px; height: 96px; flex-shrink: 0; }
  .legend { display: grid; gap: 6px; font-size: 14px; font-weight: 700; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: middle; }
  .findings { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
  .findings li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--bg); font-size: 14px; font-weight: 700; }
  .findings li.is-done { opacity: 0.7; }
  .findings li.is-done .f-title { text-decoration: line-through; text-decoration-color: rgba(31,45,61,.35); }
  .sev { width: 10px; height: 10px; border-radius: 50%; }
  .sev.high { background: var(--missing); } .sev.medium { background: var(--found); } .sev.low { background: var(--sighting); }
  .f-meta { font-size: 12px; color: var(--ink-2); font-weight: 700; display: block; }
  .owner { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--primary-light); color: var(--primary-dark); white-space: nowrap; }

  .groups { display: grid; gap: 12px; margin-top: 16px; }
  .group-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 46px; gap: 12px; align-items: center; font-size: 14px; font-weight: 700; }
  .group-row span:last-child { text-align: right; color: var(--ink-2); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pill-ph { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: var(--highlight-light); color: var(--highlight-on); }
  details.more { margin-top: 14px; }
  details.more summary { cursor: pointer; font-weight: 800; color: var(--primary); font-size: 14px; }

  .pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 8px; margin-top: 14px; }
  .page { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--bg); font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot.ok { background: var(--reunited); box-shadow: 0 0 0 3px var(--reunited-tint); }
  .dot.bad { background: var(--missing); box-shadow: 0 0 0 3px var(--missing-tint); }
  .big-number { display: flex; align-items: baseline; gap: 10px; margin-top: 14px; }
  .big-number strong { font-size: 44px; font-weight: 900; line-height: 1; }
  .big-number span { font-weight: 700; color: var(--ink-2); }
  .split { display: flex; height: 10px; border-radius: 999px; overflow: hidden; margin-top: 12px; background: var(--surface-muted); }
  .split i { display: block; height: 100%; }

  .timeline { list-style: none; margin: 14px 0 0; padding: 0 0 0 18px; border-left: 2px solid var(--line); display: grid; gap: 12px; }
  .timeline li { position: relative; font-size: 14px; font-weight: 600; }
  .timeline li::before { content: ""; position: absolute; left: -25px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 3px solid var(--primary); }
  .timeline time { display: block; font-size: 12px; font-weight: 800; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.05em; }

  .reminders { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
  .rem { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--radius-sm); background: var(--bg); border-left: 4px solid var(--line); font-size: 15px; font-weight: 700; }
  .rem.soon { border-left-color: var(--found); }
  .rem.overdue { border-left-color: var(--missing); background: var(--missing-tint); }
  .rem-date { font-weight: 800; }
  .rem-date small { display: block; font-size: 12px; font-weight: 700; color: var(--ink-2); }
  @media (max-width: 560px) { .rem { grid-template-columns: minmax(0, 1fr) auto; } .rem-text { grid-column: 1 / -1; } }
  .seen { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
  .seen-side { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-md); background: var(--bg); }
  .seen-side strong { display: block; font-size: 15px; font-weight: 800; }
  .seen-side div span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .who { flex-shrink: 0; font-size: 11px; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; color: #fff; padding: 4px 10px; border-radius: 999px; }
  .thread { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
  .thread li { display: grid; grid-template-columns: 78px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--bg); }
  .thread li .who { justify-self: start; margin-top: 2px; }
  .thread-main { display: grid; gap: 2px; min-width: 0; }
  .thread-main b { font-size: 14px; font-weight: 800; overflow-wrap: anywhere; }
  .reply { font-size: 13px; font-weight: 700; color: var(--primary-dark); overflow-wrap: anywhere; }
  .thread-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .board-totals { display: grid; gap: 10px; margin-top: 14px; }
  .tester-access { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 14px; padding: 10px 14px; border-radius: var(--radius-md); background: var(--primary-light); color: var(--primary-dark); font-size: 14px; font-weight: 700; }
  .tester-signin { margin-top: 14px; padding: 14px; border-radius: var(--radius-md); background: var(--bg); display: grid; gap: 10px; }
  .tester-signin .sub { margin: 0; }
  .tester-fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; }
  .tester-fields input { font: 600 15px var(--font); padding: 8px 12px; min-height: 40px; min-width: 0; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); }
  .tester-note { margin-top: 10px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--highlight-light); color: var(--highlight-on); font-size: 14px; font-weight: 700; }
  .tester-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .filter { font: 800 13px var(--font); min-height: 32px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
  .filter.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .testers { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
  .testers li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--bg); }
  .tester-main { display: grid; gap: 2px; min-width: 0; }
  .tester-main b { font-size: 15px; font-weight: 800; overflow-wrap: anywhere; }
  .tester-email { font-size: 14px; font-weight: 700; color: var(--primary-dark); overflow-wrap: anywhere; }
  @media (max-width: 720px) { .seen { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) { .tester-fields { grid-template-columns: minmax(0, 1fr); } .testers li { grid-template-columns: minmax(0, 1fr); gap: 6px; } .testers li .st { justify-self: start; } }
  @media (max-width: 560px) { .thread li { grid-template-columns: minmax(0, 1fr); gap: 6px; } .thread-tags { justify-content: flex-start; } }
  .foot-note { text-align: center; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .state { text-align: center; padding: 60px 20px; }
  .state h2 { font-size: 22px; font-weight: 900; }
  .state p { color: var(--ink-2); font-weight: 600; margin-top: 8px; }

  @media (max-width: 980px) {
    .hero-panel { grid-template-columns: minmax(0, 1fr); }
    .roadmap { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 720px) {
    .grid-2 { grid-template-columns: minmax(0, 1fr); }
    .roadmap { grid-template-columns: minmax(0, 1fr); }
    .cp { grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; }
    .cp .bar, .cp .st { grid-column: 2; }
    .cp-num { grid-row: span 2; }
  }
  @media (max-width: 560px) {
    .dash { padding-block: 12px 40px; gap: 14px; }
    .panel { padding: 16px; }
    .dials { grid-template-columns: minmax(0, 1fr); }
    .dial { grid-template-columns: auto minmax(0, 1fr); justify-items: start; text-align: left; column-gap: 14px; }
    .dial .ring { grid-row: span 2; width: 84px; height: 84px; }
    .ring .ring-text { font-size: 19px; }
    .gauge-value { font-size: 44px; }
    .group-row { grid-template-columns: 90px minmax(0, 1fr) 40px; }
  }
  @media (prefers-reduced-motion: reduce) { .bar > i, .anim { transition: none !important; } }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap topbar">
    <a class="brand" href="../index.html" aria-label="Homeward Paws website"><img src="../assets/img/logo-horizontal.svg" alt="Homeward Paws" width="183" height="40"></a>
    <div class="topbar-meta">
      <span class="lock"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 1 1 6 0v3H9Z"/></svg>Private</span>
      <span id="updated">Loading…</span>
      <button type="button" class="refresh" id="refresh">Refresh</button>
    </div>
  </div>
</header>

<main id="main" class="wrap dash">
  <div class="panel state" id="state"><h2>Loading the dashboard…</h2></div>
  <div id="content" hidden></div>
  <p class="foot-note">Refreshed by Claude with every agent-board report (about every 4 hours) from the repository, the live website and the board. The testers list is read live when you open this page and is never stored in the dashboard data.</p>
</main>

<script src="../assets/js/auth-config.js"></script>
<script src="../assets/js/vendor/supabase.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
